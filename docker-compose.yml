services:
  mysql:
    image: mysql:8.4
    container_name: pokedex-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pokedex}
      MYSQL_USER: ${MYSQL_USER:-pokedex_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pokedex_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pokedex-seed
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-pokedex_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-pokedex_password}
      DB_NAME: ${MYSQL_DATABASE:-pokedex}
      POKEDEX_POKEMON_LIMIT: ${POKEDEX_POKEMON_LIMIT:-300}
    command: ["npm", "run", "seed:if-empty"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pokedex-api
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-pokedex_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-pokedex_password}
      DB_NAME: ${MYSQL_DATABASE:-pokedex}
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pokedex-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mysql_data:
